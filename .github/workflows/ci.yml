name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, for the mutation job that is too slow to gate a pull request.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs are split so that a failure names itself. Reading a 400-line log to work
# out which invariant broke is the thing this avoids.
#
# Three more jobs arrive with step 1, when there is something for them to run:
#   determinism      — build twice from a clean checkout, diff, byte-identical
#                      or fail; same for SVG under a pinned layout; with
#                      PYTHONHASHSEED varied so dict-ordering leaks surface
#   dogfood          — `ab check` against absicht's own .absicht/
#   schema-migration — load the previous schema version's fixtures and migrate
jobs:
  # Everything a pull request is gated on. The suite is defined in
  # scripts/verify.sh, which is also what the git hooks run, so a green local
  # run and a green CI run mean the same thing.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install the toolchain
        # --locked fails if uv.lock has drifted from pyproject.toml.
        run: uv sync --locked
      - name: Verify
        run: ./scripts/verify.sh

  # New lines in a change must be covered. Unambiguous, and it is the coverage
  # signal that means something — unlike a repo-wide percentage, which mostly
  # teaches you to write tests for getters.
  diff-coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install the toolchain
        run: uv sync --locked
      - name: Measure
        run: uv run pytest --cov=absicht --cov-report=xml
      - name: Diff coverage
        run: |
          uv run diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=100

  # The most valuable check in the suite and the most expensive: it is the only
  # one that answers "do these tests assert anything", which is precisely how
  # agent-written tests fail. Nightly and on demand, never in the push gate.
  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install the toolchain
        run: uv sync --locked
      - name: Mutation testing
        run: ./scripts/verify.sh mutation
      - name: Keep the survivor list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-stats
          path: mutants/mutmut-*stats.json
          if-no-files-found: warn
